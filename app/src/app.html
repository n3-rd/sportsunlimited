<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		
		<!-- Favicons -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="manifest" href="/site.webmanifest" />
		
		<!-- Mobile App Experience -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Sports Unlimited" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#09090b" />
		<meta name="msapplication-TileColor" content="#09090b" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <!-- Default SEO (can be overridden by pages) -->
        <meta name="description" content="Get the latest Nigerian sports news on Football, NPFL, Basketball, Athletics, and more. Your premier destination for sports updates." />
        <meta name="keywords" content="Nigerian sports, NPFL, Football, Basketball, Athletics, Sports News Nigeria" />
        <meta name="author" content="Sports Unlimited" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Sports Unlimited" />
        <meta property="og:locale" content="en_NG" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@SportsUnlimited" />

		<!-- Google tag (gtag.js) -->
